[project]
name = "wextly-player"
version = "1.0.0"
description = "Wextly Music Player"
requires-python = ">=3.10"
# Эти пакеты ставятся на телефон при сборке APK.
# Версии можно «зафиксировать» командой: python scripts/pin_versions.py
dependencies = ["flet==1.1.0", "flet-audio==1.1.0", "mutagen==1.48.1", "telethon==1.45.0", "yt-dlp==2026.8.19"]

[tool.flet]
product = "Wextly Player"
org = "com.wextly"
company = "Wextly"
copyright = ""

[tool.flet.app]
path = "src"          # папка с main.py

[tool.flet.android.permission]
"android.permission.INTERNET" = true
