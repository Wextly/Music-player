name: Сборка Android APK

on:
  workflow_dispatch:          # кнопка «Run workflow» на вкладке Actions
  push:
    tags: ["v*"]              # а также при создании тега v1.0.0 и т.д.

permissions:
  contents: write             # нужно, чтобы выложить APK в раздел Releases

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Скачать код
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Установить Flet (версия берётся из pyproject.toml)
        run: |
          VER="$(python scripts/flet_version.py)"
          if [ -n "$VER" ]; then pip install "flet==$VER"; else pip install flet; fi
          flet --version

      - name: Кэш Flutter и Gradle (ускоряет следующие сборки)
        uses: actions/cache@v4
        with:
          path: |
            ~/flutter
            ~/.gradle/caches
          key: flutter-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: flutter-${{ runner.os }}-

      - name: Собрать APK
        run: flet build apk --verbose

      - name: Сохранить APK как артефакт сборки
        uses: actions/upload-artifact@v4
        with:
          name: wextly-player-apk
          path: build/apk/*.apk
          if-no-files-found: error

      - name: Выложить APK в Releases (только для тегов v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/apk/*.apk
